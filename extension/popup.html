<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeoDM Integration</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><h1>NeoDM Integration</h1><button id="test" type="button">Test connection</button></header>
<section>
<label><input type="checkbox" id="ribbon"> Show media ribbon on pages</label>
<p class="hint">Detects direct video/audio files and progressive streams. DRM-protected and DASH/HLS-only streams cannot be downloaded.</p>
</section>
<details><summary>Download capture</summary>
<label><input type="checkbox" id="capture"> Capture browser downloads</label>
<label><input type="checkbox" id="cookies"> Include authentication cookies</label>
<p class="hint">Redirects compatible browser downloads to NeoDM. If you cancel in NeoDM, the browser download continues.</p>
</details>
<p id="status" role="status" aria-live="polite"></p>
<script src="popup.js"></script>
</body></html>
